<title>Certified Doctors carousel – preview</title>
<style>
  /* ---- Certified Doctors carousel: copy from here ---- */
  .cd-section { --cd-accent: #0f7b6c; --cd-ink: #142033; --cd-muted: #5b6678; --cd-card: #fff; --cd-bg: #f3f7f9;
    background: var(--cd-bg); padding: 64px 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--cd-ink); }
  .cd-wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  .cd-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
  .cd-eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--cd-accent); }
  .cd-head h2 { margin: 6px 0 6px; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.15; }
  .cd-head p { margin: 0; color: var(--cd-muted); max-width: 560px; }
  .cd-nav { display: flex; gap: 10px; }
  .cd-nav button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #d5dde4; background: #fff; cursor: pointer; font-size: 20px; color: var(--cd-ink); }
  .cd-nav button:hover { background: var(--cd-accent); border-color: var(--cd-accent); color: #fff; }
  .cd-track { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * 20px) / 4); gap: 20px;
    overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 4px 2px 12px; scrollbar-width: none; }
  .cd-track::-webkit-scrollbar { display: none; }
  .cd-card { scroll-snap-align: start; background: var(--cd-card); border-radius: 16px; overflow: hidden; box-shadow: 0 6px 24px rgba(20, 32, 51, .08); display: flex; flex-direction: column; }
  .cd-photo { position: relative; aspect-ratio: 4 / 5; background: #e9eef2; }
  .cd-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .cd-badge { position: absolute; left: 12px; top: 12px; display: inline-flex; align-items: center; gap: 5px; background: var(--cd-accent); color: #fff; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; }
  .cd-rating { position: absolute; right: 12px; bottom: 12px; background: #fff; font-size: 13px; font-weight: 700; padding: 5px 9px; border-radius: 8px; }
  .cd-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .cd-body h3 { margin: 0; font-size: 18px; }
  .cd-spec { color: var(--cd-accent); font-weight: 600; font-size: 14px; }
  .cd-qual { color: var(--cd-muted); font-size: 13px; }
  .cd-meta { list-style: none; margin: 8px 0 12px; padding: 0; font-size: 13px; color: var(--cd-ink); display: grid; gap: 4px; }
  .cd-actions { margin-top: auto; display: flex; gap: 8px; }
  .cd-actions a { flex: 1; text-align: center; text-decoration: none; font-size: 14px; font-weight: 600; padding: 10px; border-radius: 10px; }
  .cd-call { background: var(--cd-accent); color: #fff; }
  .cd-profile { border: 1px solid var(--cd-accent); color: var(--cd-accent); }
  .cd-dots { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
  .cd-dots button { width: 8px; height: 8px; border-radius: 50%; border: 0; background: #c7d1da; cursor: pointer; padding: 0; }
  .cd-dots button[aria-current="true"] { background: var(--cd-accent); width: 22px; border-radius: 4px; }
  @media (max-width: 1024px) { .cd-track { grid-auto-columns: calc((100% - 2 * 20px) / 3); } }
  @media (max-width: 760px)  { .cd-track { grid-auto-columns: calc((100% - 20px) / 2); } }
  @media (max-width: 520px)  { .cd-track { grid-auto-columns: 82%; } .cd-nav { display: none; } }
  /* ---- end of carousel styles ---- */
</style>
</head>
<body style="margin:0">

  (function () {
    const { section, doctors } = CD_DATA;
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const tel = (p) => "tel:" + (p.startsWith("0") ? "+91" + p.slice(1) : p).replace(/[^+\d]/g, "");
    document.getElementById("cd-eyebrow").textContent = "✔ " + section.eyebrow;
    document.getElementById("cd-title").textContent = section.title;
    document.getElementById("cd-sub").textContent = section.subtitle;

    const track = document.getElementById("cd-track");
    track.innerHTML = doctors.map((d) => `
      <article class="cd-card">
        <div class="cd-photo">
          <img src="${esc(d.photo)}" alt="${esc(d.name)}, ${esc(d.specialty)}" loading="lazy" width="600" height="750" />
          <span class="cd-badge">&#10004; Certified</span>
          ${d.googleRating ? `<span class="cd-rating">&#9733; ${d.googleRating.score} <small>(${d.googleRating.count})</small></span>` : ""}
        </div>
        <div class="cd-body">
          <h3>${esc(d.name)}</h3>
          <div class="cd-spec">${esc(d.specialty)}</div>
          ${d.qualifications ? `<div class="cd-qual">${esc(d.qualifications)}</div>` : ""}
          <ul class="cd-meta">
            ${d.experience ? `<li>&#9201; ${esc(d.experience)} experience</li>` : ""}
            <li>&#127973; ${esc(d.hospital)}</li>
            <li>&#128205; ${esc(d.city)}</li>
          </ul>
          <div class="cd-actions">
            <a class="cd-call" href="${tel(d.phone)}">Call</a>
            ${d.profileUrl ? `<a class="cd-profile" href="${esc(d.profileUrl)}">View Profile</a>` : ""}
          </div>
        </div>
      </article>`).join("");

    const cards = () => [...track.children];
    const perView = () => Math.max(1, Math.round(track.clientWidth / cards()[0].getBoundingClientRect().width));
    const pages = () => Math.ceil(doctors.length / perView());
    const dots = document.getElementById("cd-dots");
    const page = () => Math.round(track.scrollLeft / track.clientWidth);
    const go = (p) => { const n = pages(); p = (p + n) % n; track.scrollTo({ left: p * track.clientWidth }); };
    const drawDots = () => {
      dots.innerHTML = Array.from({ length: pages() }, (_, i) => `<button type="button" aria-label="Page ${i + 1}"${i === page() ? ' aria-current="true"' : ""}></button>`).join("");
      [...dots.children].forEach((b, i) => b.addEventListener("click", () => go(i)));
    };
    document.querySelectorAll(".cd-nav button").forEach((b) => b.addEventListener("click", () => go(page() + Number(b.dataset.dir))));
    track.addEventListener("scroll", () => { clearTimeout(track._t); track._t = setTimeout(drawDots, 120); });
    window.addEventListener("resize", drawDots);
    drawDots();

    // Autoplay every 4 s; pauses while the visitor hovers or touches the carousel.
    let paused = false;
    track.addEventListener("mouseenter", () => (paused = true));
    track.addEventListener("mouseleave", () => (paused = false));
    track.addEventListener("touchstart", () => (paused = true), { passive: true });
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(() => !paused && go(page() + 1), 4000);
  })();
